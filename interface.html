<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency Price Tracker</title>

    <link rel="stylesheet" href="static/style.css">
</head>

<body>

    <!-- Header -->

    <header>
        <h1>Cryptocurrency Price Tracker</h1>
        <p>Real-Time Cryptocurrency Market Dashboard</p>
    </header>

    <!-- Statistics Cards -->

    <section class="cards">

        <div class="card">
            <h3>Total Coins</h3>
            <p id="totalCoins">0</p>
        </div>

        <div class="card">
            <h3>Top Gainer</h3>
            <p id="topGainer">Loading...</p>
        </div>

        <div class="card">
            <h3>Highest Market Cap</h3>
            <p id="marketCap">Loading...</p>
        </div>

        <div class="card">
            <h3>Most Expensive</h3>
            <p id="expensiveCoin">Loading...</p>
        </div>

    </section>

    <!-- Search -->

    <section class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search Cryptocurrency">
    </section>

    <!-- Crypto Table -->

    <section class="table-section">

        <table>

            <thead>
                <tr>
                    <th>Coin Name</th>
                    <th>Price</th>
                    <th>24h Change</th>
                    <th>Market Cap</th>
                </tr>
            </thead>

            <tbody id="cryptoTable">
            </tbody>

        </table>

    </section>

    <!-- Chart -->

    <section class="chart-section">

        <h2>Top Cryptocurrency Prices</h2>

        <canvas id="cryptoChart"></canvas>

    </section>

    <!-- Footer -->

    <footer>
        <p>© 2026 Cryptocurrency Price Tracker</p>
    </footer>

    <!-- Libraries -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script src="static/script.js"></script>

</body>

</html>
